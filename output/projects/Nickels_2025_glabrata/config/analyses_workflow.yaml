# Condition analyses of this public dataset, as streamed by the app (ytab run --workflow config/analyses_workflow.yaml).
# Comparisons follow config/comparison_design.csv (ytab comparison-design --controls all): each treated library against every control
# (or parent) of its strain and pool; multi-condition tests run per strain and drug series against its untreated reference.
